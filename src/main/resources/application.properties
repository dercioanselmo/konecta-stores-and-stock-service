spring.application.name=konecta-stores-and-stock-service
server.port=8092

spring.datasource.url=jdbc:postgresql://localhost:5432/konecta-store-stock
spring.datasource.username=apple
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.timezone=Africa/Maputo

# Shared HS256 secret used by KONECTA-SECURITY-SERVICE to sign access tokens.
# Must match the security service's signing key. Override via env JWT_SECRET.
security.jwt.secret=${JWT_SECRET:change-me-to-the-security-service-shared-secret-please}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

konecta.security-service.url=${SECURITY_SERVICE_URL:http://localhost:8091}

springdoc.swagger-ui.path=/swagger-ui.html
