spring.config.import=optional:file:.env[.properties]

spring.application.name=konecta-stores-and-stock-service
server.port=${SERVER_PORT:8092}

# K8s readinessProbe target: /actuator/health/readiness (Spring Boot's own
# availability state, decoupled from every auto-configured indicator by
# default — a downstream hiccup shouldn't flip this pod to NotReady).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/konecta-store-stock}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:apple}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.timezone=Africa/Maputo

# Shared HS256 secret used by KONECTA-SECURITY-SERVICE to sign access tokens.
# Must match the security service's signing key. Override via env JWT_SECRET.
security.jwt.secret=${JWT_SECRET:change-me-to-the-security-service-shared-secret-please}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:true}
eureka.instance.prefer-ip-address=true

konecta.security-service.url=${SECURITY_SERVICE_URL:http://localhost:8091}

springdoc.swagger-ui.path=/swagger-ui.html

# Product photos / shop logo & cover live in a private S3 bucket. The
# backend only issues presigned PUT/GET URLs — it never receives the file
# bytes. Credentials come from .env (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY),
# not the AWS SDK's own env-var chain — see common.storage.AwsS3Config.
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:konecta-media-564956047797}
aws.s3.stores-prefix=${AWS_S3_STORES_PREFIX:stores/}
aws.s3.products-prefix=${AWS_S3_PRODUCTS_PREFIX:products/}
aws.s3.users-prefix=${AWS_S3_USERS_PREFIX:users/}
aws.s3.categories-prefix=${AWS_S3_CATEGORIES_PREFIX:categories/}
aws.s3.presign-put-ttl-seconds=${AWS_S3_PRESIGN_PUT_TTL_SECONDS:300}
aws.s3.presign-get-ttl-seconds=${AWS_S3_PRESIGN_GET_TTL_SECONDS:3600}

# Storage provider: "s3" (original, needs a working AWS account + the
# aws.* block above) or "local" (default while the AWS account is
# suspended — see LocalFilesystemObjectStorageService/MediaController).
# Switching back once a paid AWS account exists again is just this one
# property.
konecta.storage.provider=${KONECTA_STORAGE_PROVIDER:local}
konecta.storage.local-dir=${KONECTA_STORAGE_LOCAL_DIR:./media-storage}
# Must be reachable by whatever browser is doing the upload — only holds
# when the frontend and this service run on the same machine.
konecta.storage.public-base-url=${KONECTA_STORAGE_PUBLIC_BASE_URL:http://localhost:8092}

# Only actually enforced for /media/** (see SecurityConfig) — every other
# endpoint here is called server-to-server from the Next.js BFF, never
# directly by a browser.
konecta.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
