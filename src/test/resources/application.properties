spring.application.name=konecta-stores-and-stock-service-test
eureka.client.enabled=false
security.jwt.secret=test-only-shared-secret-please-do-not-use-in-prod-1234567890
spring.flyway.locations=classpath:db/migration

aws.access-key-id=test-access-key
aws.secret-access-key=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket
aws.s3.stores-prefix=stores/
aws.s3.products-prefix=products/
aws.s3.users-prefix=users/
aws.s3.presign-put-ttl-seconds=300
aws.s3.presign-get-ttl-seconds=3600
